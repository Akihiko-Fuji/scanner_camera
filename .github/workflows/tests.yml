name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Final deployment compatibility lane: Windows 8 uses Python 3.8 x86.
          # The runner OS is newer than Windows 8, so this validates Python/x86
          # compatibility, not the Windows 8 kernel itself.
          - python-version: "3.8"
            architecture: x86
            runtime-label: win8-x86
          - python-version: "3.11"
            architecture: x64
            runtime-label: current-x64
          - python-version: "3.12"
            architecture: x64
            runtime-label: current-x64

    name: pytest (${{ matrix.python-version }} / ${{ matrix.architecture }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.architecture }}
          cache: pip

      - name: Verify Python runtime
        run: python -c "import platform, struct; print(platform.python_version(), struct.calcsize('P') * 8)"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest --cov=scanner_capture --cov=twain_capture --cov-report=term-missing
