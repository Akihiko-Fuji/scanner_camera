[scanner]
# WIA device name / TWAIN source name substring. Leave blank to use the first scanner.
device = fi-65F
show_ui = false

# true: fail when a requested setting is not exposed or cannot be changed.
# false: issue a warning and continue with the driver default.
strict_settings = true

[scan]
dpi = 600
mode = color

# Driver values, not EV or shutter speed unless the selected backend explicitly
# reports otherwise. Run --diagnose before deciding valid values.
brightness = 0
contrast = 0

[region]
# Empty means the driver's current/full-bed region.
# WIA uses these values directly as pixels. TWAIN converts the same pixel values
# to inches using [scan] dpi before setting DAT_IMAGELAYOUT.
xpos =
ypos =
width =
height =

[twain]
# Blank: let pytwain load the native 64-bit TWAINDSM.dll.
# Set an explicit full path only when DSM auto-loading fails.
dsm_name =

# TWAIN-only settings. Empty keeps the Data Source current/default value.
autobright =
exposure_time =
gamma =
lamp_state =
light_source =
bit_depth =

[output]
directory = ./jpeg
jpeg_quality = 95

[diagnostics]
directory = ./diagnostics

# WIA: no-change write/read-back probe for writable WIA properties.
# TWAIN: no-change SET/read-back probe for scanner_camera target capabilities.
# Use --no-probe-writes to suppress this from the CLI.
probe_writes = true
