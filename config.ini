[scanner]
# WIA device name / TWAIN source name substring. Leave blank to use the first scanner.
device = fi-65F
show_ui = false

# true: fail when a requested setting is not exposed, cannot be changed, or
# cannot be confirmed by read-back.
# false: issue a warning and continue on a best-effort basis.
strict_settings = true

[scan]
dpi = 600
mode = color

# Driver values, not EV or shutter speed unless the selected backend explicitly
# reports otherwise. Run --diagnose before deciding valid values.
brightness = 0
contrast = 0

[region]
# Empty means the driver's current/full-bed region.
# WIA uses these values directly as pixels. TWAIN first confirms ICAP_UNITS=inches
# and the actual X/Y resolution read-back, then converts pixels to DAT_IMAGELAYOUT.
xpos =
ypos =
width =
height =

[twain]
# Blank: let pytwain select the DSM automatically.
# With pytwain 2.3.x on 32-bit Windows/TWAIN 1 this normally resolves to
# %WINDIR%\twain_32.dll. 64-bit Python normally requires twaindsm.dll.
# Set an explicit path/name only when automatic DSM selection is unsuitable.
dsm_name =

# TWAIN-only settings. Empty keeps the Data Source current/default value.
# autobright and lamp_state accept only "on" or "off".
autobright =
exposure_time =
gamma =
lamp_state =
light_source =
bit_depth =

[output]
directory = ./jpeg
jpeg_quality = 95

[diagnostics]
directory = ./diagnostics

# Safe default: diagnostics are read-only. Enable no-change write/read-back
# probes explicitly with --probe-writes or by changing this value to true.
probe_writes = false
