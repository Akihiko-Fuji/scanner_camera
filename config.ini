[scanner]
# WIA device name substring. Leave blank to use the first WIA scanner.
device = fi-65F
show_ui = false

# true: fail when a requested setting is not exposed or is read-only.
# false: issue a warning and continue with the driver default.
strict_settings = true

[scan]
dpi = 600
mode = color

# WIA values, not EV, shutter time, or guaranteed analog gain.
# Run --diagnose before deciding valid values.
brightness = 0
contrast = 0

[region]
# Empty means the driver's current/full-bed region.
xpos =
ypos =
width =
height =

[output]
directory = ./jpeg
jpeg_quality = 95

[diagnostics]
directory = ./diagnostics

# true performs a no-change write/read-back probe for properties that claim
# to be writable. Use --no-probe-writes to suppress this from the CLI.
probe_writes = true
